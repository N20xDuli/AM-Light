[package]
name = "am-light"
version = "0.2.8"
description = "Apple Music desktop client with native Direct2D UI, synced lyrics, and audio visualizer"
authors = ["N20xDuli"]
license = "MIT"
repository = "https://github.com/N20xDuli/AM-Light"
edition = "2021"

[lib]
name = "am_light_lib"
path = "src/lib.rs"

[[bin]]
name = "AM-Light"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync", "net", "io-util", "macros"] }
regex = "1"
base64 = "0.22"
percent-encoding = "2.3"
url = "2"
once_cell = "1"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Media_Control",
    "Storage_Streams",
    "System",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
